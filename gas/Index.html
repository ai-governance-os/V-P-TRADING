<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>V&amp;P TRADING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080A; --bg2:#0E0E11; --card:rgba(255,255,255,.032); --card2:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14);
  --gold:#C9A227; --gold2:#E7CE8C; --goldsoft:rgba(201,162,39,.14);
  --txt:#F7F6F3; --dim:#B9B8B1; --dim2:#918F87;
  --ok:#4BC08B; --warn:#E0A44B; --bad:#E2685F;
  --r:18px; --sf:'Cormorant Garamond',Georgia,serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:400 16px/1.55 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  overflow-x:hidden; letter-spacing:-.01em;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 500px at 80% -10%, rgba(201,162,39,.10), transparent 60%),
    radial-gradient(700px 500px at -10% 100%, rgba(201,162,39,.055), transparent 62%);
}
#app{position:relative;z-index:1;min-height:100%}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:9px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select{outline:none}

/* ============ LOGIN ============ */
.vpmark{display:block;width:118px;height:118px;margin:0 auto 4px;object-fit:contain;
  filter:drop-shadow(0 6px 26px rgba(201,162,39,.22))}
img.vpmark.sm{width:40px;height:40px;margin:0 auto;flex:none;
  filter:drop-shadow(0 2px 10px rgba(201,162,39,.18))}
/* 照客户的商标排法：圆标在上，字在下面 */
.top .brand{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto}
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 26px;text-align:center}
.mark{font-family:var(--sf);font-size:52px;font-weight:500;letter-spacing:.14em;line-height:1;
  background:linear-gradient(160deg,#FBF3DC 0%,var(--gold2) 42%,var(--gold) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.mark .amp{font-style:italic;font-weight:400;padding:0 2px}
.rule{width:64px;height:1px;margin:20px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.75}
.sub{color:var(--dim);font-size:12px;letter-spacing:.36em;text-transform:uppercase;margin-bottom:46px}
.pinbox{display:flex;gap:13px;margin-bottom:30px}
.pindot{width:13px;height:13px;border-radius:50%;border:1px solid var(--line2);transition:.28s}
.pindot.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 16px rgba(201,162,39,.6);transform:scale(1.12)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:15px}
.key{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  font-size:23px;font-weight:300;transition:.16s;display:flex;align-items:center;justify-content:center}
.key:active{background:var(--goldsoft);border-color:var(--gold);transform:scale(.93)}
.key.fn{font-size:13px;letter-spacing:.13em;color:var(--dim);border-color:transparent;background:none}
.err{color:var(--bad);font-size:13.5px;margin-top:20px;min-height:18px;letter-spacing:.02em}
.shake{animation:sh .42s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ============ 月结单表格 ============ */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -3px}
.tbl{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
.tbl th{text-align:left;font-weight:500;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim2);padding:6px 8px;border-bottom:1px solid var(--line2);position:sticky;top:0}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.045)}
.tbl tr:last-child td{border-bottom:none}
.tbl .r{text-align:right}
.tbl td.d{color:var(--dim)}
.tbl tbody tr:nth-child(even){background:rgba(255,255,255,.018)}

/* ============ SHELL ============ */
.top{position:sticky;top:0;z-index:40;padding:calc(11px + env(safe-area-inset-top,0px)) 16px 11px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(180deg,rgba(8,8,10,.96),rgba(8,8,10,.72) 70%,transparent);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.top .wm{font-family:var(--sf);font-size:12px;letter-spacing:.26em;font-weight:500;white-space:nowrap;line-height:1;
  background:linear-gradient(150deg,#FBF3DC,var(--gold2) 50%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);letter-spacing:.06em;
  min-width:0;flex-shrink:1}
.who>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:88px}
.chipr{padding:5px 11px;border:1px solid var(--line);border-radius:99px;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gold2);background:var(--goldsoft)}
.lo{padding:6px 12px;border:1px solid var(--line2);border-radius:99px;font-size:12px;color:var(--txt);
  letter-spacing:.1em;transition:.2s;background:var(--card);white-space:nowrap;flex:0 0 auto}
.chipr{white-space:nowrap;flex:0 0 auto}
.lo:active{border-color:var(--bad);color:var(--bad)}
.wrap{padding:6px 18px calc(112px + var(--safe-b))}
.view{display:none;animation:fade .38s cubic-bezier(.22,1,.36,1)}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.h1{font-family:var(--sf);font-size:31px;font-weight:400;letter-spacing:.01em;margin:14px 0 3px}
.h1s{color:var(--dim);font-size:12px;letter-spacing:.26em;text-transform:uppercase;margin-bottom:24px}

/* ============ NAV ============ */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));z-index:50;
  display:flex;gap:2px;padding:5px;border-radius:99px;border:1px solid var(--line);
  background:rgba(16,16,19,.86);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  box-shadow:0 14px 44px rgba(0,0,0,.6)}
.nb{padding:11px 18px;border-radius:99px;font-size:14px;color:var(--dim);transition:.24s;white-space:nowrap;letter-spacing:.03em}
.nb.on{color:#151206;background:linear-gradient(140deg,var(--gold2),var(--gold));font-weight:600;
  box-shadow:0 3px 14px rgba(201,162,39,.34)}

/* ============ CARDS / FORM ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.lbl{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;display:block}
.inp{width:100%;padding:15px 16px;border-radius:13px;border:1px solid var(--line2);
  background:rgba(255,255,255,.045);font-size:16.5px;transition:.22s;letter-spacing:.01em}
.inp:focus{border-color:var(--gold);background:rgba(201,162,39,.05);box-shadow:0 0 0 3px rgba(201,162,39,.09)}
.inp::placeholder{color:var(--dim2)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 19px) 22px,calc(100% - 14px) 22px;background-size:5px 5px;background-repeat:no-repeat}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 15px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  font-size:14.5px;color:var(--txt);transition:.2s;letter-spacing:.01em}
.chip.on{border-color:var(--gold);background:var(--goldsoft);color:var(--gold2);font-weight:600}
.chip small{display:block;font-size:11.5px;opacity:.8;margin-top:2px;font-weight:400}
.row{display:flex;gap:11px}.row>*{flex:1}
.ac{position:relative}
.aclist{position:absolute;top:calc(100% + 7px);left:0;right:0;z-index:60;max-height:242px;overflow-y:auto;
  background:#141417;border:1px solid var(--line2);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.66);padding:5px}
.aci{padding:12px 13px;border-radius:9px;cursor:pointer;font-size:15.5px;transition:.13s}
.aci:hover,.aci.hl{background:var(--goldsoft);color:var(--gold2)}
.aci b{font-weight:600}.aci span{color:var(--dim);font-size:12.5px;display:block;margin-top:2px}
.aci.addnew{color:var(--gold2);font-weight:600;border-top:1px solid var(--line);margin-top:5px;padding-top:13px}
.aci.addnew span{color:var(--dim2);font-weight:400}
.step{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:13px;overflow:hidden}
.step button{width:52px;height:50px;font-size:21px;font-weight:300;color:var(--dim);transition:.16s;background:rgba(255,255,255,.02)}
.step button:active{background:var(--goldsoft);color:var(--gold)}
.step input{flex:1;border:none;background:none;text-align:center;font-size:20px;font-weight:500;padding:0;width:100%}

/* ============ SUMMARY ============ */
.sum{border-radius:var(--r);padding:20px;margin-bottom:14px;
  background:linear-gradient(155deg,rgba(201,162,39,.14),rgba(201,162,39,.03) 55%,transparent);
  border:1px solid rgba(201,162,39,.3)}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0}
.sumrow+.sumrow{border-top:1px solid rgba(255,255,255,.05)}
.sumrow .k{color:var(--dim);font-size:14px;letter-spacing:.03em}
.sumrow .v{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.sumrow.big .v{font-family:var(--sf);font-size:33px;font-weight:500;color:var(--gold2)}
.cur{font-size:12.5px;color:var(--dim);margin-right:3px;font-weight:400}

/* ============ BUTTONS ============ */
.btn{width:100%;padding:17px;border-radius:14px;font-size:16px;font-weight:600;letter-spacing:.04em;transition:.2s}
.btn.p{background:linear-gradient(140deg,var(--gold2),var(--gold));color:#141105;box-shadow:0 5px 22px rgba(201,162,39,.3)}
.btn.p:active{transform:scale(.985);box-shadow:0 2px 10px rgba(201,162,39,.25)}
.btn.g{background:linear-gradient(140deg,#3ED07E,#1FA45E);color:#04220F;box-shadow:0 5px 22px rgba(37,190,110,.26)}
.btn.o{border:1px solid var(--line2);background:var(--card);color:var(--txt)}
.btn.danger{border:1px solid rgba(226,104,95,.42);background:rgba(226,104,95,.1);color:var(--bad)}
.btn.danger:active{background:rgba(226,104,95,.2)}
.btn[disabled]{opacity:.32;pointer-events:none}

/* ============ STATS ============ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px}
.stat .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;font-weight:500}
.stat .v{font-family:var(--sf);font-size:32px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--dim);font-family:'Inter';margin-right:3px;font-weight:400}
.stat .v .unit{font-family:'Inter';font-size:12.5px;color:var(--dim);font-weight:400;margin-left:5px;letter-spacing:.06em}
.stat.hi{background:linear-gradient(155deg,rgba(201,162,39,.15),rgba(201,162,39,.02));border-color:rgba(201,162,39,.3)}
.stat.hi .v{color:var(--gold2)}
.bar{display:flex;align-items:center;gap:11px;padding:9px 0}
.bar+.bar{border-top:1px solid rgba(255,255,255,.04)}
.bar .n{width:88px;font-size:13px;color:var(--dim);flex-shrink:0;letter-spacing:.02em}
.bar .t{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.055);overflow:hidden}
.bar .f{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .8s cubic-bezier(.22,1,.36,1)}
.bar .a{width:78px;text-align:right;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--txt)}

/* ============ LIST ============ */
.oi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 15px;margin-bottom:9px;transition:.18s}
.oi.sel{border-color:var(--gold);background:var(--goldsoft)}
.oi .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.oi .b{font-size:15.5px;font-weight:600;letter-spacing:.01em}
.oi .s{font-size:12.5px;color:var(--dim);margin-top:3px}
.oi .amt{font-size:16.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.oi .r2{display:flex;gap:7px;margin-top:11px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:4px 9px;border-radius:7px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.tag.op{background:rgba(224,164,75,.14);color:var(--warn)}
.tag.paid{background:rgba(75,192,139,.14);color:var(--ok)}
.tag.pend{background:rgba(226,104,95,.13);color:var(--bad)}
.tag.dlv{background:rgba(255,255,255,.06);color:var(--dim)}
.tag.set{background:rgba(255,255,255,.05);color:var(--dim)}

/* ============ MISC ============ */
.empty{text-align:center;padding:56px 20px;color:var(--dim);font-size:15px}
.empty .ic{font-family:var(--sf);font-size:42px;opacity:.28;margin-bottom:12px}
.hint{background:rgba(75,192,139,.1);border:1px solid rgba(75,192,139,.3);border-radius:12px;
  padding:12px 15px;font-size:13.5px;color:var(--ok);margin-bottom:14px;line-height:1.55}
.newbox{background:rgba(201,162,39,.08);border:1px dashed rgba(201,162,39,.42);border-radius:14px;padding:14px}
.addlink{display:block;width:100%;margin-top:13px;padding:13px;border-radius:12px;
  border:1px dashed rgba(201,162,39,.5);background:rgba(201,162,39,.08);
  color:var(--gold2);font-size:14.5px;font-weight:600;letter-spacing:.02em;transition:.2s}
.addlink:active{background:rgba(201,162,39,.2)}
.load{display:flex;align-items:center;justify-content:center;padding:52px}
.spin{width:26px;height:26px;border:2px solid rgba(201,162,39,.18);border-top-color:var(--gold);border-radius:50%;animation:sp .75s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* 通知：永远不吃点击（pointer-events:none），收起时整个 hidden，不会挡住底部分页 */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(110px);bottom:calc(88px + var(--safe-b));
  z-index:400;pointer-events:none;visibility:hidden;opacity:0;
  padding:14px 24px;border-radius:99px;background:#22222A;border:1px solid var(--line2);font-size:14.5px;
  box-shadow:0 14px 40px rgba(0,0,0,.62);max-width:88vw;text-align:center;
  transition:transform .38s cubic-bezier(.22,1,.36,1),opacity .3s,visibility 0s linear .38s}
.toast.on{transform:translateX(-50%) translateY(0);visibility:visible;opacity:1;transition-delay:0s}
.toast.ok{border-color:rgba(75,192,139,.45)}.toast.bad{border-color:rgba(226,104,95,.45)}
.sheet{position:fixed;inset:0;z-index:150;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);animation:fade .3s}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;background:#101013;border-top:1px solid var(--line2);
  border-radius:26px 26px 0 0;padding:11px 20px calc(26px + var(--safe-b));max-height:88vh;overflow-y:auto;
  animation:up .42s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:34px;height:4px;border-radius:99px;background:var(--line2);margin:0 auto 20px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;
  background:rgba(0,0,0,.42);border:1px solid var(--line);border-radius:13px;padding:15px;color:var(--dim);max-height:230px;overflow-y:auto}
.seg{display:flex;gap:3px;padding:3px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:15px}
.seg button{flex:1;padding:10px;border-radius:9px;font-size:14px;color:var(--dim);transition:.2s;letter-spacing:.02em}
.seg button.on{background:var(--card2);color:var(--gold2);font-weight:600}
.ok-ic{width:64px;height:64px;margin:6px auto 18px;border-radius:50%;
  background:linear-gradient(145deg,rgba(75,192,139,.22),rgba(75,192,139,.06));
  border:1px solid rgba(75,192,139,.42);display:flex;align-items:center;justify-content:center;
  font-size:29px;color:var(--ok);animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@media(min-width:760px){.wrap{max-width:640px;margin:0 auto}.grid2{grid-template-columns:repeat(4,1fr)}}
</style>

<body>
<div id="app"><div class="load"><div class="spin"></div></div></div>
<div class="toast" id="toast"></div>

<!-- sheet -->
<div class="sheet" id="sheet"><div class="bd" onclick="closeSheet()"></div>
  <div class="pn"><div class="grab"></div><div id="sheetBody"></div></div></div>

<script>
/* ================= 状态 ================= */
var S={user:null,boot:null,view:'order',sel:{},dash:null,orders:[],month:0,bill:null,billMonth:0};
var F={ // 表单
  salesman:'',branch:'',brand:'',state:'',region:'',setType:'',price:0,profit:0,qty:1,
  paid:false,payMethod:'OP',payDate:'',payNote:'',
  drvColor:'',drvGrade:'',drvNote:'',drvDesc:'',
  note:'',ovTotal:'',ovMine:'',ovFee:'',invoiceTo:'SA'
};
/** 记住上次选的颜色，同一间分行多半一样 */
function rememberDrv(){ try{ if(F.drvColor) LASTCOLOR=F.drvColor }catch(e){} }
var LASTCOLOR='';
/** 单卖伞/袋 → pcs，其他 → set。跟送货单一致。 */
function unitOf(st){
  var t=String(st||'').toUpperCase();
  if(t.indexOf('+')>=0)return 'set';
  if(/UMBRELLA|BAG/.test(t)&&!/ITEM/.test(t))return 'pcs';
  return 'set';
}
/** 送货单上那句（颜色+款式，没选就用价目表说明） */
function drvPreview(){
  var b=[];
  if(F.drvColor)b.push(F.drvColor);
  if(F.drvGrade)b.push(F.drvGrade);
  if(!b.length&&F.drvDesc)b.push(F.drvDesc);
  if(!b.length)return '';
  return F.setType+'（'+b.join('')+'）';
}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
var COLORS=['黑色','红色'];
var GRADES=['普通雨伞','好的雨伞'];
var MONTHS=['','一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

/* ================= 后端桥接（本地预览有 mock） ================= */
var HAS_GS = (typeof google!=='undefined' && google.script && google.script.run);
function call(fn,args){
  return new Promise(function(res,rej){
    if(HAS_GS){
      google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null,args||[]);
    } else if(window.MOCK && MOCK[fn]){
      setTimeout(function(){res(MOCK[fn].apply(null,args||[]))},220);
    } else rej(new Error('后端未连接：'+fn));
  });
}
function rm(n){return (Math.round(n*100)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}
function rm0(n){return Math.round(n).toLocaleString('en-MY')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hideToast(){var e=document.getElementById('toast');
  if(!e)return; clearTimeout(e._t); e.className='toast'}
function toast(m,t){var e=document.getElementById('toast');
  if(!e)return;
  e.textContent=m; e.className='toast on '+(t||'');
  clearTimeout(e._t);
  e._t=setTimeout(function(){ e.className='toast '+(t||'') },2600);
}
function openSheet(h){hideToast();document.getElementById('sheetBody').innerHTML=h;
  document.getElementById('sheet').className='sheet on'}
function closeSheet(){var s=document.getElementById('sheet');
  if(!s)return; s.className='sheet';
  // 收起后清空内容，避免旧的弹窗残留
  setTimeout(function(){ if(s.className==='sheet'){var b=document.getElementById('sheetBody'); if(b)b.innerHTML=''} },400);
}
/* 保险：碰到画面任何地方就把通知收掉；返回键 / Esc 关弹窗 */
document.addEventListener('pointerdown',function(){hideToast()},true);
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){hideToast();closeSheet()} });

  for(var i=0;i<4;i++)d[i].className='pindot'+(i<PIN.length?' on':'');
  var g=document.getElementById('pinGo');
  if(g&&!BUSY){ if(PIN.length===4)g.removeAttribute('disabled'); else g.setAttribute('disabled',''); }
}
function pinPush(n){if(BUSY||PIN.length>=4)return;PIN+=n;pinDots()}
function pinBack(){if(BUSY)return;PIN=PIN.slice(0,-1);pinDots()}
function pinClear(){if(BUSY)return;PIN='';pinDots();document.getElementById('perr').textContent=''}
function pinBusy(on,txt){
  BUSY=on;
  var g=document.getElementById('pinGo'); if(!g)return;
  if(on){g.setAttribute('disabled','');g.innerHTML='<span class="spin" style="width:17px;height:17px;display:inline-block;vertical-align:-3px;margin-right:9px"></span>'+(txt||'验证中…')}
  else{g.textContent='确认';pinDots()}
}
function doLogin(){
  if(BUSY||PIN.length<4)return;
  document.getElementById('perr').textContent='';
  pinBusy(true,'验证中…');
  var t0=Date.now();
  var tick=setTimeout(function(){pinBusy(true,'载入资料…')},1200);
  call('loginAndBoot',[PIN]).then(function(r){
    clearTimeout(tick);
    if(!r.ok){
      pinBusy(false);
      document.getElementById('perr').textContent=r.msg;
      document.querySelector('.pad').classList.add('shake');
      setTimeout(function(){document.querySelector('.pad').classList.remove('shake');pinClear()},450);
      return;
    }
    S.user=r.user; S.boot=r.boot; F.pay=r.boot.defaultPay||'OP';
    S.view=(r.user.role==='driver')?'driver':'order';
    AUTH=PIN; BUSY=false; PIN=''; renderApp();
  }).catch(function(e){
    clearTimeout(tick); pinBusy(false);
    document.getElementById('perr').textContent=String(e.message||e);
  });
}
function logout(){
  if(!confirm('确定登出？'))return;
  S.user=null;S.boot=null;S.orders=[];S.dash=null;S.sel={};S.month=0;PIN='';BUSY=false;AUTH='';S.users=null;
  F.salesman='';F.branch='';F.brand='';F.state='';F.region='';F.setType='';F.price=0;F.profit=0;F.qty=1;
  F.note='';F.ovTotal='';F.ovMine='';F.ovFee='';
  renderLogin();
}

function go(v,keep){
  S.view=v; hideToast();
  document.querySelectorAll('.view').forEach(function(e){e.className='view'});
  document.getElementById('v-'+v).className='view on';
  document.querySelectorAll('.nb').forEach(function(b){
    b.className='nb'+(b.getAttribute('onclick').indexOf("'"+v+"'")>=0?' on':'')});
  if(v==='order')renderOrder();
  if(v==='list')loadList();
  if(v==='dash')loadDash();
  if(v==='driver')loadDriver();
  if(v==='set')loadSettings();
  if(v==='bill')loadBill();
}

function renderOrder(){
  var b=S.boot;
  var types=Object.keys(b.setTypes);
  var tiers=F.setType?b.setTypes[F.setType]:[];
  var branches=F.salesman&&b.people[F.salesman]?b.people[F.salesman]:[];
  var total=F.qty*F.price, mine=F.qty*F.profit, fee=calcFee();
  var ready=F.salesman&&F.branch&&F.setType&&F.price>0&&F.qty>0;

  document.getElementById('v-order').innerHTML=
  '<div class="h1">新订单</div><div class="h1s">New Order</div>'+

  '<div class="card"><label class="lbl">销售员</label>'+
   '<div class="ac"><input class="inp" id="smq" placeholder="输入名字…" autocomplete="off" '+
     'value="'+esc(F.salesman)+'" oninput="acSearch(this.value)" onfocus="acSearch(this.value)">'+
     '<div id="aclist"></div></div>'+
   '<button class="addlink" onclick="askNewSalesman()">＋ 名单里没有这个人？新增销售员</button>'+
   (branches.length?('<div style="margin-top:14px"><label class="lbl">Branch'+
      (branches.length>1?' <span style="color:var(--gold2);letter-spacing:0;text-transform:none;font-size:10px">· '+branches.length+' 间，请选</span>':'')+
      '</label><div class="chips">'+branches.map(function(x,i){
       return '<button class="chip'+(F.branch===x.branch?' on':'')+'" onclick="pickBranch('+i+')">'+
         esc(x.branch)+'<small>'+esc(x.state)+' · '+esc(x.brand)+'</small></button>'}).join('')+'</div></div>'):'')+
  '</div>'+

  '<div class="card"><label class="lbl">Set</label>'+
   '<div class="chips">'+types.map(function(t){
     return '<button class="chip'+(F.setType===t?' on':'')+'" onclick="pickSet(\''+esc(t).replace(/'/g,"\\'")+'\')">'+esc(t)+'</button>'}).join('')+
   '</div>'+
   (tiers.length?('<div style="margin-top:15px"><label class="lbl">售价 / '+unitOf(F.setType)+'</label><div class="chips">'+
     tiers.map(function(t,i){return '<button class="chip'+(F.price===t.price?' on':'')+'" onclick="pickPrice('+i+')">RM '+t.price+
       '<small>赚 RM'+t.profit+'</small></button>'}).join('')+'</div></div>'):'')+
  '</div>'+

  '<div class="card"><label class="lbl">数量（'+(F.setType?unitOf(F.setType):'set')+'）</label>'+
   '<div class="step"><button onclick="qty(-1)">−</button>'+
   '<input type="number" inputmode="numeric" value="'+F.qty+'" oninput="F.qty=Math.max(0,parseInt(this.value)||0);softSum()">'+
   '<button onclick="qty(1)">+</button></div>'+
   '<div style="height:16px"></div>'+
   '<div style="border-top:1px solid var(--line);padding-top:14px">'+
     '<label class="lbl" style="color:var(--gold2)">给司机看的</label>'+
     '<div style="color:var(--dim2);font-size:12px;margin:-4px 0 10px">会印在 WhatsApp 送货单上</div>'+
     '<div class="chips" style="margin-bottom:10px">'+
       COLORS.map(function(c){return '<button class="chip'+(F.drvColor===c?' on':'')+
         '" onclick="F.drvColor=(F.drvColor===\''+c+'\'?\'\':\''+c+'\');rememberDrv();renderOrder()">'+c+'</button>'}).join('')+
     '</div>'+
     '<div class="chips" style="margin-bottom:10px">'+
       GRADES.map(function(g){return '<button class="chip'+(F.drvGrade===g?' on':'')+

     (drvPreview()?'<div class="hint" style="margin-top:10px;background:rgba(201,162,39,.07);border-color:rgba(201,162,39,.22);color:var(--gold2)">'+

  '</div>'+

  '<button class="btn p" '+(ready?'':'disabled')+' onclick="submit()">确认下单</button>';
  acRender([]);
}
function sumHtml(total,mine,fee){
  var admin=boss();
  return '<div class="sumrow big"><span class="k">总额</span><span class="v"><span class="cur">RM</span>'+rm(F.ovTotal!==''?F.ovTotal:total)+'</span></div>'+
   (admin?'<div class="sumrow"><span class="k">我的利润</span><span class="v" style="color:var(--ok)"><span class="cur">RM</span>'+rm(F.ovMine!==''?F.ovMine:mine)+'</span></div>':'')+
   '<div class="sumrow"><span class="k">司机抽成</span><span class="v" style="color:var(--warn)"><span class="cur">RM</span>'+rm(F.ovFee!==''?F.ovFee:fee)+'</span></div>';
}
function softSum(){
  var t=F.qty*F.price,m=F.qty*F.profit,f=calcFee();
  var el=document.getElementById('sumbox'); if(el)el.innerHTML=sumHtml(t,m,f);
  var btn=document.querySelector('.btn.p');
  if(btn){var ready=F.salesman&&F.branch&&F.setType&&F.price>0&&F.qty>0;
    if(ready)btn.removeAttribute('disabled');else btn.setAttribute('disabled','')}
}
function calcFee(){ // 前端即时预览，提交时后端会重算
  var st=(F.state||'').toUpperCase(), rg=(F.region||'').toUpperCase();
  if(rg==='SOUTH')return 0;
  if(st==='NS'||st==='N9')return Math.round(F.qty*F.price*0.10*100)/100;
  var umb=(F.setType||'').toUpperCase().indexOf('UMBRELLA')>=0;
  return Math.round(F.qty*(umb?1:2.5)*100)/100;
}
function qty(d){F.qty=Math.max(0,F.qty+d);
  var i=document.querySelector('.step input'); if(i)i.value=F.qty; softSum()}
function setPaidNow(){F.paid=true;if(!F.payDate)F.payDate=today();renderOrder()}

  var names=Object.keys(S.boot.people);
  var starts=[],inc=[];
  names.forEach(function(n){ if(n.indexOf(Q)===0)starts.push(n); else if(n.indexOf(Q)>=0)inc.push(n) });
  acCur=starts.concat(inc).slice(0,9); acHl=-1; acRender(acCur);
  // 名字完全对上 → 自动带出分行。
  // 但如果使用者已经自己挑过分行（同一个人有两三间），就不要把他挑的那间
  // 重设回第一间 —— 重画页面後输入框会重新 focus，这里会再跑一次。
  var ex=S.boot.people[Q];
  if(ex){
    var picked=F.branch&&ex.some(function(x){return x.branch===F.branch});
    if(picked)F.salesman=Q; else setPerson(Q, ex[0]);
  }
}
function acRender(list){
  var el=document.getElementById('aclist'); if(!el)return;
  var q=F.salesman.trim().toUpperCase();
  var rows=list.map(function(n,i){
    var p=S.boot.people[n], b=p[0];
    return '<div class="aci'+(i===acHl?' hl':'')+'" onmousedown="acPick(\''+n.replace(/'/g,"\\'")+'\')">'+
      '<b>'+esc(n)+'</b><span>'+esc(b.branch)+(p.length>1?' 等 '+p.length+' 间':'')+'</span></div>'}).join('');
  if(q){
    rows+='<div class="aci addnew" onmousedown="askNewSalesman()">＋ 新增销售员「'+esc(q)+'」'+
      '<span>'+(list.length?'找不到你要的人？点这里建立':'名单里没有这个人，点这里建立')+'</span></div>';
  }
  el.innerHTML=rows?'<div class="aclist">'+rows+'</div>':'';
}
function acPick(n){ setPerson(n,S.boot.people[n][0]); renderOrder(); }
function setPerson(n,b){ F.salesman=n; F.branch=b.branch; F.brand=b.brand; F.state=b.state; F.region=b.region; }
function pickBranch(i){var b=S.boot.people[F.salesman][i];
  F.branch=b.branch;F.brand=b.brand;F.state=b.state;F.region=b.region;renderOrder()}
/** SET 名字里有 BLACK / RED 就自动带出颜色 */
function colorOfSet(st){
  var t=String(st||'').toUpperCase();
  if(t.indexOf('BLACK')>=0)return '黑色';
  if(t.indexOf('RED')>=0)return '红色';
  return '';
}
function applyTier(t){
  F.price=t.price; F.profit=t.profit; F.drvDesc=t.desc||'';
  // 价目表写了「普通雨伞 / 好的雨伞」就自动亮那一颗，省得每次点
  var g=GRADES.filter(function(x){return F.drvDesc===x})[0];
  F.drvGrade = g || '';
}
function pickSet(t){F.setType=t;var ts=S.boot.setTypes[t];
  if(ts&&ts.length===1){applyTier(ts[0])}else{F.price=0;F.profit=0;F.drvDesc='';F.drvGrade=''}
  var c=colorOfSet(t);
  if(c)F.drvColor=c;                       // BLACK / RED UMBRELLA：名字就写明了
  else if(!F.drvColor&&LASTCOLOR)F.drvColor=LASTCOLOR;
  renderOrder()}
function pickPrice(i){applyTier(S.boot.setTypes[F.setType][i]);renderOrder()}

}
function nbMode(m){NB.mode=m;drawNewSalesman()}
function nbOptions(list){
  if(!list.length)return '<div style="color:var(--dim2);font-size:13px;padding:8px">找不到，改用「开新分行」</div>';
  return list.map(function(b){
    return '<button class="chip'+(NB.branch===b.branch?' on':'')+'" onclick="NB.branch=\''+esc(b.branch).replace(/'/g,"\\'")+'\';NB.state=\''+esc(b.state)+'\';drawNewSalesman()">'+
      esc(b.branch)+'<small>'+esc(b.state)+'</small></button>'}).join('');
}
function nbFilter(q){
  q=(q||'').trim().toUpperCase();
  var bs=S.boot.branches.filter(function(b){return !q||b.branch.toUpperCase().indexOf(q)>=0}).slice(0,14);
  var el=document.getElementById('nblist'); if(el)el.innerHTML=nbOptions(bs);
}
function brandOf(b){
  var L=['PERODUA','PROTON','HONDA','CHERY','JAECOO','JETOUR','MITSUBISHI','EMAS','ICAUR'];
  b=(b||'').toUpperCase();
  for(var i=0;i<L.length;i++)if(b.indexOf(L[i])===0)return L[i];
  return 'OTHER';
}
function saveSalesman(){
  var name=(NB.name||'').trim().toUpperCase().replace(/\s+/g,' ');
  var branch=(NB.branch||'').trim().toUpperCase().replace(/\s+/g,' ');
  if(!name){toast('请填销售员名字','bad');var n=document.getElementById('nbPerson');if(n)n.focus();return}
  if(!branch){toast('请选择或输入分行','bad');return}
  if(!NB.state){toast('请选州属','bad');return}
  var region=(NB.state==='Johor'||NB.state==='Melaka')?'SOUTH':'CENTRAL';
  var brand=brandOf(branch);
  call('addSalesman',[{salesman:name,branch:branch,brand:brand,state:NB.state,region:region}])
  .then(function(r){
    if(!r.ok){toast(r.msg,'bad');return}
    if(!S.boot.people[name])S.boot.people[name]=[];
    S.boot.people[name].unshift({branch:branch,brand:brand,state:NB.state,region:region,n:0,primary:true});
    if(!S.boot.branches.some(function(b){return b.branch===branch}))
      S.boot.branches.push({branch:branch,brand:brand,state:NB.state,region:region});
    F.salesman=name;
    setPerson(name,S.boot.people[name][0]);
    closeSheet();toast('已新增 '+name+' · '+branch,'ok');renderOrder();
  }).catch(function(e){toast(String(e.message||e),'bad')});
}

  call('submitOrder',[{salesman:F.salesman,branch:F.branch,brand:F.brand,state:F.state,region:F.region,
    setType:F.setType,price:F.price,profitPerSet:F.profit,qty:F.qty,note:F.note,

var BR={id:'',q:'',pick:null,also:false};
function askBranch(id){
  var o=findO(id); if(!o)return;
  BR={id:id,q:'',pick:null,also:false,salesman:o.salesman,from:o.branch};

function drawBranch(){

  }).slice(0,40);

/** 换分行弹窗里选目标分行。名字不能叫 pickBranch —— 下单页已经有一个同名的，会互相盖掉。 */
function brPick(name){
  var pv=document.getElementById('brpv');
  if(pv)pv.innerHTML='<div class="load"><div class="spin"></div></div>';
  call('previewBranch',[{id:BR.id,branch:name}]).then(function(r){

    var warn=r.feeChanged;
    document.getElementById('brpv').innerHTML=

       (warn?'background:rgba(233,168,53,.10);border-color:rgba(233,168,53,.34)':'')+'">'+

function saveBranch(){

    if(!r.ok){toast(r.msg,'bad');return}
    closeSheet();
    var m='已改成 '+BR.pick.branch;
    if(Math.abs(r.diff)>0.005)m+='，抽成 RM '+rm(r.oldFee)+' → RM '+rm(r.newFee);

/* --- 月结单 → Excel（SheetJS，失败就退回 CSV） --- */
function billRows(){
  var b=S.bill,out=[];
  out.push([b.company+' — 司机月结单']);
  out.push(['司机',b.driver,'月份',b.monthName,'产生时间',b.generated]);
  out.push([]);
  b.sections.forEach(function(s){
    out.push([s.title]);
    var h=['BIL','DATE','BRANCH','SALESMAN','SET'];
    if(s.showPrice)h.push('PRICE');
    h.push('COMMISSION','SET & DETAIL');
    out.push(h);
    s.rows.forEach(function(r){
      var row=[r.bil,r.date,r.branch,r.salesman,r.qty];
      if(s.showPrice)row.push(r.price);
      row.push(r.fee,r.setType);
      out.push(row);
    });
    out.push(['','','','','小计','', s.fee,'']);
    out.push([]);
  });
  out.push(['抽成合计','',b.fee]);
  out.push(['Allowance','',b.allowance]);
  out.push(['小计','',b.subtotal]);
  if(b.cashTotal){
    out.push(['扣：司机已收现金 (PC)','',-b.cashTotal]);
    b.cash.forEach(function(c){out.push(['　· '+c.branch+' — '+c.salesman,c.date,c.amount])});
  }
  out.push(['应转账给司机','',b.payable]);
  return out;
}
function dl(blob,name){
  var u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1500);
}
function billName(ext){
  var b=S.bill;
  return 'VP_'+(b.driver||'DRIVER').replace(/\s+/g,'')+'_'+b.monthName+'_月结单.'+ext;
}
function csvBill(){
  var esc2=function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var s='﻿'+billRows().map(function(r){return r.map(esc2).join(',')}).join('\r\n');
  dl(new Blob([s],{type:'text/csv;charset=utf-8'}),billName('csv'));
  toast('已下载 CSV，用 Excel 打开就行','ok');
}
/** 载入 SheetJS 再做事；载不到就走退路 */
function withXLSX(ok,fail){
  if(window.XLSX)return ok(window.XLSX);
  toast('准备 Excel…','ok');
  var done=false;
  var sc=document.createElement('script');
  sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  sc.onload=function(){ if(done)return; done=true; try{ok(window.XLSX)}catch(e){fail(e)} };
  sc.onerror=function(){ if(done)return; done=true; fail() };
  document.head.appendChild(sc);
  setTimeout(function(){ if(!done&&!window.XLSX){ done=true; fail() } },9000);
}
function exportBill(){
  if(!S.bill){toast('还没有资料','bad');return}
  withXLSX(xlsxBill,csvBill);
}
function xlsxBill(){
  var b=S.bill,X=window.XLSX;
  var ws=X.utils.aoa_to_sheet(billRows());
  ws['!cols']=[{wch:6},{wch:11},{wch:26},{wch:16},{wch:7},{wch:9},{wch:12},{wch:18}];
  var wb=X.utils.book_new();
  X.utils.book_append_sheet(wb,ws,b.monthName.slice(0,28));
  X.writeFile(wb,billName('xlsx'));
  toast('Excel 已下载','ok');
}
function waBill(){
  var b=S.bill;
  var L=['*'+b.company+' — '+b.monthName+' 月结*',''];
  b.sections.forEach(function(s){L.push(s.title+'：RM '+rm(s.fee))});

function monthlyDetail(r){

          'My income','SET & DETAIL','司机抽成','收钱了吗','收款方式','收款日期','收款备注','送货','备注']];

function monthlySummary(r){

    [r.company+' — '+r.monthName+' 月结总览'],

function monthlyTrend(r){
  var a=[[ (r.company||'V&P TRADING')+' — 每月走势（到 '+MONTHS[r.month]+'为止）'],[],
    ['月份','订单','SET','营业额','我的利润','司机抽成','已收','未收',
     '累计营业额','累计利润','累计司机抽成']];

function monthlyBranches(r){

function buildMonthlyXlsx(X,r){

}
function csvMonthly(r){
  var esc2=function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var out=monthlySummary(r).concat([[],[]],monthlyTrend(r),[[],[]],monthlyDetail(r),[[],[]],monthlyBranches(r));
  var s='﻿'+out.map(function(row){return (row||[]).map(esc2).join(',')}).join('\r\n');

    return '<div style="margin-bottom:16px">'+
      '<div class="lbl" style="letter-spacing:.14em;margin-bottom:7px">'+esc(k)+'</div>'+
      g[k].map(function(x){

            '<span style="opacity:.65;font-size:12.5px"> · 利 RM '+x.profit+'</span>'+

   '<div class="h1s" style="margin-bottom:16px">停用只是从下单页藏起来，历史不受影响</div>'+

/* --- 合并分行 --- */
var MG={from:'',to:'',q1:'',q2:'',pv:null};
function askMerge(){ MG={from:'',to:'',q1:'',q2:'',pv:null}; drawMerge() }
function mgList(which){
  var q=(which==='from'?MG.q1:MG.q2), sel=(which==='from'?MG.from:MG.to);
  var list=(S.boot.branches||[]).filter(function(b){
    if(which==='to'&&MG.from&&b.branch===MG.from)return false;
    if(which==='from'&&MG.to&&b.branch===MG.to)return false;
    return !q||b.branch.toUpperCase().indexOf(q.toUpperCase())>=0}).slice(0,8);
  return list.map(function(b){
    return '<button class="chip'+(sel===b.branch?' on':'')+'" style="margin:0 6px 6px 0" '+
      'onclick="pickMerge(\''+which+'\',\''+esc(b.branch).replace(/'/g,"\\'")+'\')">'+esc(b.branch)+'</button>'}).join('')
    || '<div style="font-size:13px;color:var(--dim2)">找不到</div>';
}
function drawMerge(){
  openSheet('<div style="font-family:var(--sf);font-size:25px;margin-bottom:3px">合并分行</div>'+
   '<div class="h1s" style="margin-bottom:18px">把旧写法并到正式名称</div>'+
   '<label class="lbl" style="color:var(--bad)">要并掉的（旧写法）</label>'+
   '<input class="inp" placeholder="打字找…" value="'+esc(MG.q1)+'" oninput="MG.q1=this.value;refreshMerge()" style="margin-bottom:9px">'+
   '<div class="chips" id="mgL1">'+mgList('from')+'</div>'+
   '<div style="height:16px"></div>'+
   '<label class="lbl" style="color:var(--ok)">保留的（正式名称）</label>'+
   '<input class="inp" placeholder="打字找，或直接打新名字" value="'+esc(MG.q2)+'" oninput="MG.q2=this.value;refreshMerge()" style="margin-bottom:9px">'+
   '<div class="chips" id="mgL2">'+mgList('to')+'</div>'+
   '<div id="mgNew" style="margin-top:6px">'+mgNewBtn()+'</div>'+
   '<div id="mgPv"></div>'+
   '<div style="height:12px"></div><button class="btn o" onclick="closeSheet()">取消</button>');
}
/** 打的名字名单里没有 → 让他直接用这个新名字（等于改名） */
function mgNewBtn(){
  var q=(MG.q2||'').trim();
  if(q.length<3)return '';
  var exists=(S.boot.branches||[]).some(function(b){return b.branch.toUpperCase()===q.toUpperCase()});
  if(exists)return '';
  return '<button class="chip" style="border-style:dashed" onclick="pickMerge(\'to\',\''+
    esc(q).replace(/'/g,"\\'")+'\')">用新名字「'+esc(q)+'」（改名）</button>';
}
function refreshMerge(){
  var a=document.getElementById('mgL1'),b=document.getElementById('mgL2'),c=document.getElementById('mgNew');
  if(a)a.innerHTML=mgList('from'); if(b)b.innerHTML=mgList('to'); if(c)c.innerHTML=mgNewBtn();
}
function pickMerge(which,name){
  if(which==='from')MG.from=name; else MG.to=name;
  refreshMerge();
  var pv=document.getElementById('mgPv');
  if(!MG.from||!MG.to){if(pv)pv.innerHTML='';return}
  pv.innerHTML='<div class="load"><div class="spin"></div></div>';
  call('previewMergeBranch',[{from:MG.from,to:MG.to}]).then(function(r){
    if(!r.ok){toast(r.msg,'bad');pv.innerHTML='';return}
    MG.pv=r;
    pv.innerHTML='<div class="card" style="margin-top:16px;background:rgba(233,168,53,.10);border-color:rgba(233,168,53,.34)">'+
      '<label class="lbl" style="color:var(--warn)">按下去会发生什么</label>'+
      '<div class="sumrow"><span class="k">'+esc(r.from)+' 的订单</span><span class="v" style="font-size:16px">'+r.orders+' 笔</span></div>'+
      '<div class="sumrow"><span class="k">'+(r.rename?'改名成':'全部改成')+'</span><span class="v" style="font-size:15px;color:var(--ok)">'+esc(r.to)+'</span></div>'+
      (r.salesmen?'<div class="sumrow"><span class="k">销售员名单</span><span class="v" style="font-size:16px">'+r.salesmen+' 行一起搬</span></div>':'')+
      (Math.abs(r.feeDiff)>0.005
        ?'<div class="sumrow"><span class="k" style="color:var(--warn)">司机抽成合计</span>'+
           '<span class="v" style="color:var(--warn)">'+(r.feeDiff>0?'+':'')+'RM '+rm(r.feeDiff)+'</span></div>'+
         '<div class="hint" style="margin-top:9px;background:rgba(233,168,53,.09);border-color:rgba(233,168,53,.3)">'+
           '两边州属不同，抽成规则不一样，会重算。</div>'
        :'<div class="sumrow"><span class="k">司机抽成</span><span class="v" style="font-size:15px">不变</span></div>')+
      (r.brandChanged
        ?'<div class="sumrow"><span class="k">品牌栏</span><span class="v" style="font-size:15px">'+
           esc(r.brandFrom)+' → '+esc(r.brandTo)+'</span></div>':'')+
      ((r.near&&r.near.length)
        ?'<div class="hint" style="margin-top:10px;background:rgba(233,168,53,.13);border-color:rgba(233,168,53,.45);color:var(--warn)">'+
           '⚠ 名单里已经有很像的：'+r.near.map(function(x){
             return '<b>'+esc(x.branch)+'</b>'+(x.n?'（'+x.n+' 笔）':'')}).join('、')+
           '<br>是不是要选这一间？打错字会多生一间分行出来。</div>':'')+
      '<div class="hint" style="margin-top:10px">'+
        (r.rename?'这是改名 —— 名单上那一行的名字会换掉，打错了再改回来就好。'
                 :'「'+esc(r.from)+'」会从分行名单移除。<b>合并之后没办法再拆开</b>，因为分不出哪笔本来是哪间。')+
        '</div>'+
      '<div style="height:14px"></div>'+
      (r.rename
        ?'<button class="btn p" onclick="doMerge()">确定改名</button>'
        :'<label class="lbl" style="color:var(--warn)">确认无误的话，把要并掉的名字打一次</label>'+
         '<input class="inp" id="mgCfm" placeholder="'+esc(r.from)+'" oninput="mgCheck()" style="margin-bottom:10px">'+
         '<button class="btn p" id="mgGo" disabled style="opacity:.4" onclick="doMerge()">确定合并</button>')+
    '</div>';
  }).catch(function(e){toast(String(e.message||e),'bad')});
}
/** 合并要打字确认 —— 不可复原的动作多一道手续 */
function mgCheck(){
  var i=document.getElementById('mgCfm'),b=document.getElementById('mgGo');
  if(!i||!b)return;
  var okk=mgNorm(i.value)===mgNorm(MG.from);
  b.disabled=!okk; b.style.opacity=okk?'1':'.4';
}
function mgNorm(x){return String(x||'').replace(/\u3000/g,' ').trim().toUpperCase().replace(/\s+/g,' ')}
function doMerge(){
  if(!MG.from||!MG.to){toast('两间都要选','bad');return}
  if(MG.pv&&!MG.pv.rename){
    var i=document.getElementById('mgCfm');
    if(!i||mgNorm(i.value)!==mgNorm(MG.from)){toast('请把要并掉的名字打一次','bad');return}
  }
  openSheet('<div class="load"><div class="spin"></div></div>'+
    '<div style="text-align:center;color:var(--dim);font-size:14px">合并中…</div>');
  call('mergeBranch',[{from:MG.from,to:MG.to,by:(S.user||{}).name||''}]).then(function(r){
    if(!r.ok){toast(r.msg,'bad');closeSheet();return}
    closeSheet();
    toast(r.orders+(r.rename?' 笔已改名成 ':' 笔已并入 ')+r.to,'ok');
    S.boot=null;S.dash=null;S.orders=[];
    call('bootstrap',[]).then(function(b){S.boot=b;loadSettings()}).catch(function(){loadSettings()});
  }).catch(function(e){toast(String(e.message||e),'bad')});
}

/* 付款资料健检。
   底层还是 migratePayment —— 它对已经是新格式的资料只做一件事：
   把「已收钱但没写收款日期」的补上订单日期。补过就不会再补，所以可以随时按。 */
function runCheck(){
  openSheet('<div style="font-family:var(--sf);font-size:25px;margin-bottom:3px">检查付款资料</div>'+
   '<div class="h1s" style="margin-bottom:18px">随时可以按</div>'+
   '<div class="card" style="padding:14px 15px">'+
     '<div style="font-size:13.5px;color:var(--dim);line-height:1.75">'+
       '会做两件事：<br>'+
       '① 「已收钱」但没写收款日期的，用订单日期补上<br>'+
       '② 回报有没有格式不对、需要人看一眼的资料<br><br>'+
       '<b style="color:var(--ok)">不会改动任何金额、数量或分行。</b>'+
       '已经正常的资料会直接略过，按几次结果都一样。</div>'+
   '</div>'+
   '<button class="btn p" onclick="doCheck()">开始检查</button>'+
   '<div style="height:9px"></div><button class="btn o" onclick="closeSheet()">取消</button>');
}
function doCheck(){
  openSheet('<div class="load"><div class="spin"></div></div>'+
    '<div style="text-align:center;color:var(--dim);font-size:14px">检查中，1000 多笔要一点时间…</div>');
  call('migratePayment',[AUTH]).then(function(r){
    if(!r.ok){toast(r.msg,'bad');return}
    var s=r.stat||{};
    var fixedDate=s.backfilled||0;
    var oldFmt=(s.paid||0)+(s.unpaid||0);      // 还是旧格式、这次被转过来的
    var clean=fixedDate===0&&oldFmt===0;
    openSheet('<div class="ok-ic">✓</div>'+
     '<div style="text-align:center;font-family:var(--sf);font-size:26px;margin-bottom:6px">检查完成</div>'+
     '<div class="h1s" style="text-align:center;margin-bottom:18px">'+
       (clean?'一切正常，没有需要处理的':'已经帮你补好了')+'</div>'+
     '<div class="card">'+
       '<div class="sumrow"><span class="k">检查了</span><span class="v">'+r.total+' 笔</span></div>'+
       '<div class="sumrow"><span class="k">补上收款日期</span><span class="v"'+
         (fixedDate?' style="color:var(--ok)"':'')+'>'+fixedDate+' 笔</span></div>'+
       (oldFmt
         ?'<div class="sumrow"><span class="k" style="color:var(--warn)">格式不对、已转正</span>'+
            '<span class="v" style="color:var(--warn)">'+oldFmt+' 笔</span></div>'
         :'')+
       '<div class="sumrow"><span class="k">本来就正常</span><span class="v" style="font-size:16px">'+
         (s.skipped||0)+' 笔</span></div>'+
     '</div>'+
     '<div class="hint" style="margin-top:12px">金额、数量、分行完全没有变动。</div>'+
     '<div style="height:14px"></div>'+
     '<button class="btn p" onclick="closeSheet()">好</button>');
  }).catch(function(e){toast(String(e.message||e),'bad')});
}
function saveDriver(){
  var p={name:document.getElementById('dvName').value,
         phone:document.getElementById('dvPhone').value,
         allowance:document.getElementById('dvAllow').value};
  call('adminSetDriver',[AUTH,p]).then(function(r){
    if(!r.ok){toast(r.msg,'bad');return}
    if(S.boot&&S.boot.driver){S.boot.driver.name=p.name.trim();S.boot.driver.phone=r.phone;
      S.boot.driver.allowance=parseFloat(p.allowance)||0}
    toast(r.phone?'已储存 · '+r.phone:'已储存（电话留空）','ok');
    loadSettings();
  }).catch(function(e){toast(String(e.message||e),'bad')});
}
function testWa(){
  var ph=(S.drv&&S.drv.phone)||'';
  if(!ph){toast('还没设定电话','bad');return}
  var t='V&P TRADING 测试讯息 — 如果你收到这则，代表一键通知已经设定好了。';
  window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(t),'_blank');
}
function peek(i){
  var el=document.getElementById('pv'+i);
  if(el.textContent==='••••'){el.textContent=S.users[i].pin;setTimeout(function(){el.textContent='••••'},5000)}
  else el.textContent='••••';
}
function askPin(name){
  openSheet('<div style="font-family:var(--sf);font-size:25px;margin-bottom:3px">改 PIN</div>'+
   '<div class="h1s" style="margin-bottom:20px">'+esc(name)+'</div>'+
   '<label class="lbl">新的 4 位数字</label>'+
   '<input class="inp" id="npin" inputmode="numeric" maxlength="4" placeholder="例如 8842" '+
     'style="text-align:center;font-size:26px;letter-spacing:.42em;font-family:ui-monospace,monospace">'+
   '<div style="height:20px"></div>'+
   '<button class="btn p" onclick="savePin(\''+esc(name)+'\')">确定修改</button>'+
   '<div style="height:9px"></div><button class="btn o" onclick="closeSheet()">取消</button>');
  setTimeout(function(){var n=document.getElementById('npin');if(n)n.focus()},250);
}
function savePin(name){
  var v=(document.getElementById('npin').value||'').trim();
  if(!/^\d{4}$/.test(v)){toast('PIN 必须是 4 位数字','bad');return}
  call('adminSetPin',[AUTH,name,v]).then(function(r){
    if(!r.ok){toast(r.msg,'bad');return}
    if(name===S.user.name)AUTH=v;
    closeSheet();toast(name+' 的 PIN 已改','ok');loadSettings();
  }).catch(function(e){toast(String(e.message||e),'bad')});
}
function askRename(name){
  openSheet('<div style="font-family:var(--sf);font-size:25px;margin-bottom:3px">改名字</div>'+
   '<div class="h1s" style="margin-bottom:20px">目前叫 '+esc(name)+'</div>'+
   '<label class="lbl">新名字</label>'+
   '<input class="inp" id="nnm" maxlength="20" placeholder="例如 TAN" value="'+esc(name)+'">'+
   '<div class="hint" style="margin-top:12px">改名字不影响 PIN，也不影响以前的记录。</div>'+
   '<div style="height:16px"></div>'+
   '<button class="btn p" onclick="saveRename(\''+esc(name)+'\')">确定改名</button>'+
   '<div style="height:9px"></div><button class="btn o" onclick="closeSheet()">取消</button>');
  setTimeout(function(){var n=document.getElementById('nnm');if(n){n.focus();n.select()}},250);
}
function saveRename(name){
  var v=(document.getElementById('nnm').value||'').trim();
  if(!v){toast('名字不可以空白','bad');return}
  if(v===name){closeSheet();return}
  call('adminRenameUser',[AUTH,name,v]).then(function(r){
    if(!r.ok){toast(r.msg,'bad');return}
    if(name===S.user.name)S.user.name=r.name;
    closeSheet();toast(name+' 已经改成 '+r.name,'ok');renderApp();go('set');
  }).catch(function(e){toast(String(e.message||e),'bad')});
}
function askNewUser(){
  openSheet('<div style="font-family:var(--sf);font-size:25px;margin-bottom:3px">新增帐号</div>'+
   '<div class="h1s" style="margin-bottom:20px">New account</div>'+
   '<label class="lbl">名字</label><input class="inp" id="uN" placeholder="例如 PARTNER2">'+
   '<div style="height:13px"></div><label class="lbl">PIN（4 位数字）</label>'+
   '<input class="inp" id="uP" inputmode="numeric" maxlength="4" placeholder="例如 5566" '+
     'style="text-align:center;font-size:22px;letter-spacing:.36em;font-family:ui-monospace,monospace">'+
   '<div style="height:13px"></div><label class="lbl">身分</label>'+
   '<div class="chips" id="uR">'+
     ['admin','partner','driver'].map(function(r,i){return '<button class="chip'+(i===1?' on':'')+'" data-r="'+r+'" onclick="uPick(this)">'+r+'</button>'}).join('')+
   '</div><div style="height:20px"></div>'+
   '<button class="btn p" onclick="saveUser()">建立</button>'+
   '<div style="height:9px"></div><button class="btn o" onclick="closeSheet()">取消</button>');
}
function uPick(b){document.querySelectorAll('#uR .chip').forEach(function(c){c.className='chip'});b.className='chip on'}
function saveUser(){
  var r=document.querySelector('#uR .chip.on');
  call('adminAddUser',[AUTH,document.getElementById('uN').value,document.getElementById('uP').value,r?r.getAttribute('data-r'):''])
  .then(function(x){
    if(!x.ok){toast(x.msg,'bad');return}
    closeSheet();toast('已新增','ok');loadSettings();
  }).catch(function(e){toast(String(e.message||e),'bad')});
}
function toggleUser(name,on){
  call('adminSetActive',[AUTH,name,on]).then(function(r){
    if(!r.ok){toast(r.msg,'bad');return}
    toast(on?'已启用 '+name:'已停用 '+name,'ok');loadSettings();
  }).catch(function(e){toast(String(e.message||e),'bad')});
}

/* ================= GO ================= */
renderLogin();
</script>
