<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="V&P TRADING">
<meta name="theme-color" content="#08080A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>V&amp;P TRADING</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#08080A;overflow:hidden}
  #f{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #splash{position:fixed;inset:0;background:#08080A;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:9;transition:opacity .5s;font-family:Georgia,serif}
  #splash.gone{opacity:0;pointer-events:none}
  .mk{font-size:50px;letter-spacing:.14em;color:#E7CE8C}
  .ln{width:60px;height:1px;margin:20px 0;background:linear-gradient(90deg,transparent,#C9A227,transparent)}
  .sb{font-family:-apple-system,'Segoe UI',sans-serif;font-size:11px;letter-spacing:.4em;
    text-transform:uppercase;color:#5E5D58}
</style>
</head>
<body>
<div id="splash">
  <div class="mk">V<i>&amp;</i>P</div><div class="ln"></div><div class="sb">Trading</div>
</div>

<!-- ↓↓↓ 只需要改这一行：把 src 换成你自己的 Apps Script 网址 ↓↓↓ -->
<iframe id="f" src="https://script.google.com/macros/s/AKfycbwv-QmaPM0i-B1ud8hWUAtbtz0wtQlpuzwmMIY1l7L2e7PRDurbEblJrQI9eVHmp1Sr8w/exec"
        allow="clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
  var f=document.getElementById('f'), s=document.getElementById('splash');
  f.addEventListener('load',function(){setTimeout(function(){s.className='gone'},400)});
  setTimeout(function(){s.className='gone'},9000); // 保险：最多 9 秒一定收起
</script>
</body>
</html>
